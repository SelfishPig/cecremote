<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="theme-color" name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CEC Remote">
  <link id="manifest" rel="manifest" href="/static/manifest.webmanifest">
  <link id="favicon" rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link id="apple-icon" rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <script>
    const selectedTheme = new URLSearchParams(location.search).get("theme");
    if (selectedTheme === "green") {
      document.documentElement.dataset.theme = "green";
      document.querySelector("#theme-color").content = "#28301c";
      document.querySelector("#manifest").href = "/static/manifest-green.webmanifest";
      document.querySelector("#favicon").href = "/static/icons/icon-green.svg";
      document.querySelector("#apple-icon").href = "/static/icons/apple-touch-icon-green.png";
    }
  </script>
  <title>Projector Remote</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0b0c0f;
      color: #f5f5f5;
      --page: #0b0c0f;
      --glow: #242834;
      --remote-border: #30333b;
      --remote-start: #1b1e24;
      --remote-end: #121419;
      --muted: #959aa7;
      --button-border: #3a3e48;
      --button-hover: #606674;
      --button-start: #292d35;
      --button-end: #1b1e24;
      --focus: #75a7ff;
      --power-on: #8df0ae;
      --power-off: #ff8d8d;
    }

    :root[data-theme="green"] {
      background: #10140d;
      color: #f4f6ed;
      --page: #10140d;
      --glow: #3d492b;
      --remote-border: #465334;
      --remote-start: #252d1d;
      --remote-end: #171c12;
      --muted: #a9b293;
      --button-border: #53623e;
      --button-hover: #708238;
      --button-start: #3b482d;
      --button-end: #252d1d;
      --focus: #aabd69;
      --power-on: #caff5a;
      --power-off: #ffb84d;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, var(--glow) 0, transparent 45%),
        var(--page);
    }

    .remote {
      width: min(100%, 380px);
      padding: 28px;
      border: 1px solid var(--remote-border);
      border-radius: 32px;
      background: linear-gradient(145deg, var(--remote-start), var(--remote-end));
      box-shadow: 0 28px 70px #000a, inset 0 1px #ffffff12;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 34px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    #status {
      min-height: 1.3em;
      font-size: .78rem;
      color: var(--muted);
      text-align: right;
    }

    .power-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      appearance: none;
      border: 1px solid var(--button-border);
      color: inherit;
      background: linear-gradient(145deg, var(--button-start), var(--button-end));
      box-shadow: 0 8px 16px #0006, inset 0 1px #ffffff14;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 80ms ease, border-color 120ms ease, filter 120ms ease;
    }

    button:hover { border-color: var(--button-hover); }
    button:active { transform: translateY(2px) scale(.98); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    button:disabled { cursor: wait; filter: saturate(.3); opacity: .65; }

    .power {
      min-height: 62px;
      border-radius: 18px;
      font-weight: 650;
      line-height: 1;
    }

    .power svg {
      display: block;
      width: 28px;
      height: 28px;
      margin: auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .power.on { color: var(--power-on); }
    .power.off { color: var(--power-off); }

    .sources {
      margin-top: 36px;
    }

    .source-list {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
      padding: 3px 3px 12px;
      scrollbar-width: thin;
    }

    .source-list:empty { display: none; }

    .source-list button {
      flex: 1 0 auto;
      min-height: 46px;
      padding: 10px 16px;
      border-radius: 15px;
      font-size: .82rem;
      font-weight: 650;
    }

    @media (max-height: 600px) {
      .remote { padding: 22px; }
      header { margin-bottom: 22px; }
    }
  </style>
</head>
<body>
  <main class="remote" aria-label="CEC television remote">
    <header>
      <h1>Projector</h1>
      <div id="status" role="status" aria-live="polite">Ready</div>
    </header>

    <section class="power-grid" aria-label="Power controls">
      <button class="power on" data-endpoint="/power/on" aria-label="Power on">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14" />
        </svg>
      </button>
      <button class="power off" data-endpoint="/power/off" aria-label="Power off">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="7" />
        </svg>
      </button>
    </section>

    <section class="sources" aria-label="Sources">
      <div class="source-list" id="source-list"></div>
    </section>
  </main>

  <script>
    const statusElement = document.querySelector("#status");
    const sourceList = document.querySelector("#source-list");
    let statusTimer;

    async function sendCommand(button) {
      clearTimeout(statusTimer);
      button.disabled = true;
      statusElement.textContent = "Sending...";

      try {
        const options = { method: "POST" };
        if (button.dataset.source) {
          options.headers = { "Content-Type": "application/json" };
          options.body = JSON.stringify({ physical_address: button.dataset.source });
        }
        const response = await fetch(button.dataset.endpoint, options);
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Request failed");
        statusElement.textContent = body.command;
      } catch (error) {
        statusElement.textContent = error.message || "Connection failed";
      } finally {
        button.disabled = false;
        statusTimer = setTimeout(() => { statusElement.textContent = "Ready"; }, 2500);
      }
    }

    function bindButton(button) {
      button.addEventListener("click", () => sendCommand(button));
    }

    document.querySelectorAll("button[data-endpoint]").forEach(bindButton);

    async function loadSources() {
      try {
        const response = await fetch("/sources", { cache: "no-store" });
        const sources = await response.json();
        if (!response.ok) throw new Error(sources.detail || "Could not load sources");
        sources.forEach((source) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = source.name;
          button.dataset.endpoint = "/source";
          button.dataset.source = source.physical_address;
          button.setAttribute("aria-label", `Switch to ${source.name}`);
          bindButton(button);
          sourceList.append(button);
        });
      } catch (error) {
        statusElement.textContent = error.message || "Could not load sources";
      }
    }

    loadSources();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch(() => {
          statusElement.textContent = "Offline support unavailable";
        });
      });
    }
  </script>
</body>
</html>
